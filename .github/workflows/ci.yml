name: CI

on:
  push:
    branches:
      - master
      - staging
      - trying
    tags: '*'
  pull_request:

concurrency:
  # Cancel any in-progress run when a new commit is pushed to the same PR/branch,
  # to save CI resources on frequent pushes. Runs on `master` are never cancelled.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The test environment depends on packages tied to compiler internals (Enzyme,
    # Mooncake), which routinely fail to precompile on Julia nightly. Keep the job
    # for information, but soft-fail it: the job-level `continue-on-error` only keeps
    # the workflow green (the job's own check still shows as failed), so the build and
    # test steps are also marked `continue-on-error` and a failure is reported as a
    # warning annotation instead.
    continue-on-error: ${{ matrix.version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10' # uncomment when julia 1.10 is out
          - '1'   # automatically expands to the latest stable 1.x release of Julia
          - 'nightly'
        os:
          - ubuntu-latest
          # - macOS-latest
          # - windows-latest

        include:
          - os: windows-latest
            version: '1'
          - os: macOS-latest
            version: '1'

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
        id: build
        continue-on-error: ${{ matrix.version == 'nightly' }}

      - name: "Run test without coverage"
        id: test
        uses: julia-actions/julia-runtest@v1
        if: ${{ !contains(fromJson('["1"]'), matrix.version) || matrix.os != 'ubuntu-latest' }}
        continue-on-error: ${{ matrix.version == 'nightly' }}
        with:
          coverage: false

      - name: "Report soft failure"
        if: ${{ matrix.version == 'nightly' && (steps.build.outcome == 'failure' || steps.test.outcome == 'failure') }}
        run: echo "::warning title=Julia nightly::Build or tests failed on Julia nightly (soft fail)."

      - name: "Run test with coverage"
        uses: julia-actions/julia-runtest@v1
        if: contains(fromJson('["1"]'), matrix.version) && matrix.os == 'ubuntu-latest'
      - uses: julia-actions/julia-processcoverage@v1
        if: contains(fromJson('["1"]'), matrix.version) && matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v7
        if: contains(fromJson('["1"]'), matrix.version) && matrix.os == 'ubuntu-latest'
        with:
          file: lcov.info

  test-threaded:
    name: Julia 1 - ubuntu-latest - 2 threads
    runs-on: ubuntu-latest
    env:
      NNLIB_TEST_THREADED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
